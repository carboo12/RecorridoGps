<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Sign Up</h2>
    <form id="signupForm">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div>
            <label for="role">Role:</label>
            <select id="role" name="role">
                <option value="guardas">Guard</option>
                <option value="supervisor">Supervisor</option>
                <option value="admin">Admin</option>
                <option value="dba">DBA</option>
                <option value="user">User</option> <!-- Generic user if needed -->
            </select>
        </div>
        <button type="submit">Sign Up</button>
    </form>
    <p id="signupMessage"></p>
    <p>Already have an account? <a href="{{ url_for('main.login_page') }}">Login</a></p>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const messageEl = document.getElementById('signupMessage');

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });
                const result = await response.json();
                if (response.ok) {
                    messageEl.textContent = 'User created: ' + result.message + (result.user_id ? ' (ID: ' + result.user_id + ')' : '');
                    messageEl.style.color = 'green';
                } else {
                    messageEl.textContent = 'Error: ' + result.message;
                    messageEl.style.color = 'red';
                }
            } catch (error) {
                messageEl.textContent = 'Network error: ' + error.message;
                messageEl.style.color = 'red';
            }
        });
    </script>
</body>
</html>
